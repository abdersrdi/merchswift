name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Write proof files
        run: |
          mkdir -p proof
          MERCHSWIFT_PROOF_DIR="$PWD/proof" swift test --filter StickerPDFTests/testWriteProofFiles
          ls -l proof
      - name: Look inside the PDF
        if: always()
        run: |
          apt-get update -qq
          apt-get install -y -qq qpdf poppler-utils
          qpdf --check proof/sticker-cutcontour.pdf || true
          qpdf --qdf --object-streams=disable --stream-data=uncompress proof/sticker-cutcontour.pdf proof/inspect.pdf || true
          grep -a -v "^[^ -~]" proof/inspect.pdf | grep -a -n "Separation\|OutputIntent\|TrimBox\|BleedBox\|GTS_PDFX\|DestOutputProfile\|/Type\|CutContour\| SCN\| CS" | head -60 || true
          pdfinfo proof/sticker-cutcontour.pdf || true
          pdftoppm -r 60 -png proof/sticker-cutcontour.pdf proof/render || true
          pdfimages -list proof/sticker-cutcontour.pdf || true
      - name: Test
        if: always()
        run: swift test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proof-files
          path: proof/

  apps-macos:
    name: Apps (iOS and macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package tests (includes the Metal render tests)
        run: |
          mkdir -p render-proof
          MERCHSWIFT_PROOF_DIR="$PWD/render-proof" swift test
          ls -l render-proof || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-proof
          path: render-proof/
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS
        run: |
          xcodebuild -project MerchSwift.xcodeproj -scheme MerchSwift \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -25
          exit ${PIPESTATUS[0]}
      - name: Build macOS
        run: |
          xcodebuild -project MerchSwift.xcodeproj -scheme MerchSwiftMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -25
          exit ${PIPESTATUS[0]}
