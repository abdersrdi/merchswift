name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine-linux:
    name: Engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:5.10-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Write proof files
        run: |
          mkdir -p proof
          MERCHSWIFT_PROOF_DIR="$PWD/proof" swift test --filter StickerPDFTests/testWriteProofFiles
          ls -l proof
      - name: Check the PDF with independent tools
        run: |
          apt-get update -qq
          apt-get install -y -qq qpdf poppler-utils
          qpdf --check proof/sticker-cutcontour.pdf
          pdfinfo proof/sticker-cutcontour.pdf
          pdftoppm -r 60 -png proof/sticker-cutcontour.pdf proof/render
          pdfimages -list proof/sticker-cutcontour.pdf
          grep -a -c "CutContour" proof/sticker-cutcontour.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: proof-files
          path: proof/

  apps-macos:
    name: Apps (iOS and macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Package tests
        run: swift test
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build iOS
        run: |
          xcodebuild -project MerchSwift.xcodeproj -scheme MerchSwift \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -25
          exit ${PIPESTATUS[0]}
      - name: Build macOS
        run: |
          xcodebuild -project MerchSwift.xcodeproj -scheme MerchSwiftMac \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | tail -25
          exit ${PIPESTATUS[0]}
