      - package: MerchSwift
        product: ImageTools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.pdfswift.merchswift
        PRODUCT_NAME: MerchSwift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MerchSwift
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/MerchSwift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
