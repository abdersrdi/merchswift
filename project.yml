        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-ObjC"]
  MerchSwiftMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/Shared
      - path: Apps/macOS
    dependencies:
      - package: MerchSwift
        product: CutLine
      - package: MerchSwift
