name: MerchSwift
options:
  bundleIdPrefix: cc.pdfswift
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MerchSwift:
    path: .
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: 11.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: 2.0.0
targets:
  MerchSwift:
    type: application
    platform: iOS
    sources:
      - path: Apps/Shared
      - path: Apps/iOS
        excludes:
          - Info.plist
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
      - package: MerchSwift
        product: CutLine
      - package: MerchSwift
        product: Export
      - package: MerchSwift
        product: DocumentModel
      - package: MerchSwift
        product: Editor
      - package: MerchSwift
        product: Renderer
      - package: MerchSwift
        product: Typography
      - package: MerchSwift
        product: Products
      - package: MerchSwift
        product: Preflight
      - package: MerchSwift
        product: ExportKit
      - package: MerchSwift
        product: ImageTools
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: MerchSwift
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        # AdMob app ID of MerchSwift. Debug builds request Google's sample ad units, see AdsConfig.swift.
        GADApplicationIdentifier: ca-app-pub-2683853184901962~5306981116
        NSUserTrackingUsageDescription: Allowing tracking lets MerchSwift show ads that are more relevant to you. Your designs never leave your device.
        SKAdNetworkItems:
