name: MerchSwift
options:
  bundleIdPrefix: cc.pdfswift
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MerchSwift:
    path: .
targets:
  MerchSwift:
    type: application
    platform: iOS
    sources:
      - path: Apps/Shared
    dependencies:
      - package: MerchSwift
        product: CutLine
      - package: MerchSwift
        product: Export
      - package: MerchSwift
        product: DocumentModel
      - package: MerchSwift
        product: Editor
      - package: MerchSwift
        product: Renderer
      - package: MerchSwift
        product: Typography
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.pdfswift.merchswift
        PRODUCT_NAME: MerchSwift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MerchSwift
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MerchSwiftMac:
    type: application
    platform: macOS
    sources:
      - path: Apps/Shared
      - path: Apps/macOS
    dependencies:
      - package: MerchSwift
        product: CutLine
      - package: MerchSwift
        product: Export
      - package: MerchSwift
        product: DocumentModel
      - package: MerchSwift
        product: Editor
      - package: MerchSwift
        product: Renderer
      - package: MerchSwift
        product: Typography
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.pdfswift.merchswift
        PRODUCT_NAME: MerchSwift
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MerchSwift
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.graphics-design
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/MerchSwift.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
